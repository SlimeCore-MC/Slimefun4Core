name: Pull Request

on:
  pull_request:
    paths:
    - '.github/workflows/**'
    - 'src/**'
    - 'pom.xml'

permissions:
  contents: read

jobs:
  setup-preview-build:
    name: Preview build
    runs-on: ubuntu-latest
    outputs:
     short-commit-hash: ${{ steps.env-setup.outputs.SHORT_COMMIT_HASH }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4.6.0
      with:
        distribution: 'temurin'
        java-version: '25'
        java-package: jdk
        architecture: x64

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - id: env-setup
      run: |
        SHORT_COMMIT_HASH=$(git rev-parse --short=8 "${{ github.sha }}")
        echo "SHORT_COMMIT_HASH=$SHORT_COMMIT_HASH" >> "$GITHUB_ENV"
        echo "SHORT_COMMIT_HASH=$SHORT_COMMIT_HASH" >> "$GITHUB_OUTPUT"

    - name: Build with Maven
      run: mvn -B clean verify -DskipTests

    - name: Locate the artifact
      run: |
        JAR_PATH=$(find target -maxdepth 1 -type f -name 'SlimefunCore4-*.jar' ! -name '*-sources.jar' | sort | head -n 1)
        test -n "$JAR_PATH"
        echo "JAR_PATH=$JAR_PATH" >> "$GITHUB_ENV"

    - name: Upload the artifact
      uses: actions/upload-artifact@v4
      with:
        name: slimefun-${{ github.event.number }}-${{ env.SHORT_COMMIT_HASH }}
        path: ${{ env.JAR_PATH }}
